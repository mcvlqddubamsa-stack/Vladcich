<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Block Clicker</title>
<script src="/sdk.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff}
.bg{position:fixed;inset:0;transition:opacity 1.2s;opacity:0}
.bg.on{opacity:1}
#bgc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.hue{animation:hue 8s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}
.hud{background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2);border-radius:12px;padding:6px 12px;backdrop-filter:blur(4px)}
#coins{font-size:26px;font-weight:900;text-shadow:0 2px 0 #0008;line-height:1.1}
#ps{font-size:12px;opacity:.85}
.pill{display:flex;gap:8px;align-items:center}
.btn-i{background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25);border-radius:12px;color:#fff;font-size:20px;width:44px;height:44px;cursor:pointer}
#gems{font-weight:800;font-size:15px}
#stage{position:relative;flex:1;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#tname{font-weight:900;font-size:20px;text-shadow:0 2px 0 #000a;background:rgba(0,0,0,.35);padding:3px 14px;border-radius:20px;margin-bottom:2px}
#bc{width:min(78vw,300px,36vh);height:min(78vw,300px,36vh);max-width:300px;cursor:pointer;image-rendering:pixelated;touch-action:none}
#chips{position:absolute;top:2px;left:8px;display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800}
.chip{background:rgba(0,0,0,.55);border:2px solid #ffd54a;border-radius:10px;padding:2px 8px}
.ft{position:absolute;pointer-events:none;font-weight:900;font-size:22px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:fu .9s ease-out forwards;white-space:nowrap}
.ft.crit{color:#ffd54a;font-size:30px}
@keyframes fu{0%{transform:translate(-50%,0) scale(.7);opacity:1}100%{transform:translate(-50%,-90px) scale(1.1);opacity:0}}
#gem{position:absolute;left:-60px;font-size:44px;cursor:pointer;display:none;filter:drop-shadow(0 0 10px #7ff);z-index:5;animation:fly 8s linear forwards}
@keyframes fly{0%{left:-60px;transform:translateY(0)}25%{transform:translateY(-26px)}50%{transform:translateY(14px)}75%{transform:translateY(-20px)}100%{left:105%;transform:translateY(0)}}
#toast{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 14px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:92%}
#toast.on{opacity:1}
#dock{background:rgba(14,14,20,.88);border-top:3px solid rgba(255,255,255,.18);border-radius:18px 18px 0 0;height:44vh;max-height:420px;display:flex;flex-direction:column;backdrop-filter:blur(6px)}
#tabs{display:flex;gap:4px;padding:6px 8px 0}
.tab{flex:1;background:#2a2a36;border:0;color:#bbb;padding:9px 2px;border-radius:10px 10px 0 0;font-weight:800;font-size:13px;cursor:pointer}
.tab.on{background:#4a7c3a;color:#fff}
#panels{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.panel{display:none}.panel.on{display:block}
.buyrow{display:flex;gap:6px;margin-bottom:8px}
.buyrow button{flex:1;padding:6px;border-radius:8px;border:2px solid #444;background:#222;color:#ccc;font-weight:800;cursor:pointer}
.buyrow button.on{border-color:#7bd34a;color:#fff;background:#2f4d22}
.card{display:flex;align-items:center;gap:10px;background:#242430;border:2px solid #3a3a4a;border-radius:12px;padding:8px;margin-bottom:8px}
.card .ico{font-size:28px;width:40px;text-align:center}
.card .txt{flex:1;min-width:0}
.card b{display:block;font-size:15px}
.card small{display:block;opacity:.75;font-size:12px;line-height:1.25}
.go{background:#4caf50;border:0;border-bottom:4px solid #2e7d32;color:#fff;font-weight:900;border-radius:10px;padding:8px 10px;min-width:92px;cursor:pointer;font-size:13px}
.go:active{transform:translateY(2px);border-bottom-width:2px}
.go.off{background:#555;border-bottom-color:#333;color:#aaa}
.go.ad{background:#e6a817;border-bottom-color:#a77705}
.go.pur{background:#8e44ad;border-bottom-color:#5e2c75}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-weight:700}
input[type=range]{width:55%;accent-color:#7bd34a}
.lng button{padding:6px 12px;border-radius:8px;border:2px solid #444;background:#222;color:#ccc;font-weight:800;cursor:pointer;margin-left:6px}
.lng button.on{border-color:#7bd34a;color:#fff;background:#2f4d22}
.tg{width:56px;height:30px;border-radius:15px;background:#444;position:relative;cursor:pointer;border:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:#4caf50}.tg.on::after{left:29px}
.stat{font-size:13px;opacity:.85;line-height:1.6}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.on{display:flex}
#mbox{background:#22222e;border:3px solid #6a6a8a;border-radius:16px;padding:18px;max-width:400px;width:100%;text-align:center}
#mbox h3{margin:0 0 8px;font-size:20px}
#mbox p{margin:0 0 14px;font-size:15px;line-height:1.4}
#mbtns{display:flex;flex-direction:column;gap:8px}
#mbtns .go{padding:11px}
</style>

<body>
<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>

<div id="app">
  <header>
    <div class="hud"><div id="coins">0</div><div id="ps"></div></div>
    <div class="pill">
      <div class="hud" id="gems">💎 0</div>
      <button class="btn-i" id="gear">⚙️</button>
    </div>

    <div id="toast"></div>

  <div id="dock">
    <div id="tabs">
      <button class="tab on" data-p="up"></button>
      <button class="tab" data-p="bonus"></button>
      <button class="tab" data-p="reb"></button>
      <button class="tab" data-p="set"></button>
    </div>
    <div id="panels">
      <div class="panel on" id="p-up"><div class="buyrow" id="amt"></div><div id="ups"></div></div>
      <div class="panel" id="p-bonus"></div>
      <div class="panel" id="p-reb"></div>
      <div class="panel" id="p-set"></div>
    </div>
  </div>
</div>
<div id="modal"><div id="mbox"><h3 id="mt"></h3><p id="mp"></p><div id="mbtns"></div></div></div>

<script>

d_crit:'Шанс крита (×5): %a% → %b%',d_luck:'Кристаллы летают чаще: ×%a → ×%b',d_off:'Доход без игры: %a% → %b%',
max:'МАКС',lvl:'ур.',

music:'Музыка',sfx:'Звуки',lang:'Язык',particles:'Частицы',reset:'Сбросить прогресс',resetConf:'Весь прогресс будет удалён без возможности восстановления!',saved:'Сохранено',

offT:'С возвращением!',offD:'Пока тебя не было, шахтёры добыли %s монет',take:'Забрать',take2:'Забрать ×2 (видео)',adErr:'Реклама недоступна, попробуй позже',
got:'Получено: %s',boost:'Буст',frz:'Лихорадка'},

u_tier:'Block skin',u_tap:'Tap power',u_cps:'Auto-click',u_crit:'Critical hit',u_luck:'Luck',u_off:'Offline income',
d_tier:'Next block: %s • income ×4 • new background',d_tap:'Tap power: %a → %b',d_cps:'Auto-clicks per second: %a → %b',
d_crit:'Crit chance (×5): %a% → %b%',d_luck:'Crystals fly more often: ×%a → ×%b',d_off:'Income while away: %a% → %b%',

rebConf:'Block, upgrades and coins will reset. Diamonds and luck stay. Continue?',yes:'Yes',no:'Cancel',

bonusGem:'Crystal! +%s coins',frenzy:'FRENZY! ×5 for 15 s',newBlock:'New block: %s!',noMoney:'Not enough coins',
offT:'Welcome back!',offD:'While you were away miners dug up %s coins',take:'Claim',take2:'Claim ×2 (video)',adErr:'Ad unavailable, try later',
got:'Received: %s',boost:'Boost',frz:'Frenzy'}
};
let lang='ru';
const tr=(k,...a)=>{let s=(L[lang]&&L[lang][k])||L.ru[k]||k;a.forEach(v=>s=s.replace('%s',v));return s};
const TN={ru:['Земля','Дерево','Уголь','Железо','Золото','Алмаз','Обсидиан','Незерит','Бедрок','Эндер-камень','Пурпур','Светокамень','Глубинный сланец','Космос','Звёздный блок','Пустота'],
en:['Dirt','Wood','Coal','Iron','Gold','Diamond','Obsidian','Netherite','Bedrock','End Stone','Purpur','Glowstone','Deepslate','Cosmic','Star Block','The Void']};
const tn=i=>TN[lang][Math.min(i,15)];

/* ================= data ================= */
const TIERS=[
{type:'noise',cols:['#7a5230','#6b4527','#8a6038','#5e3c20'],bg:['#7ec8e3','#4a8c3a'],spk:'#b0884f'},
{type:'planks',cols:['#b8894f','#a97a42','#c49a5c'],edge:'#6e4a22',bg:['#2f6b3a','#16341c'],spk:'#d9b26f'},
{type:'ore',cols:['#8a8a8a','#7d7d7d','#969696'],spot:['#1a1a1a','#2b2b2b'],bg:['#4a4f57','#1d2024'],spk:'#888'},
{type:'block',cols:['#d8d8d8','#cfcfcf','#e4e4e4'],edge:'#8f8f8f',hi:'#fff',bg:['#6b7f95','#2a3441'],spk:'#e0e0e0'},
{type:'block',cols:['#f6d33c','#f2c71f','#fde463'],edge:'#b8860b',hi:'#fff6b0',bg:['#ffb347','#7a3b0c'],spk:'#ffe27a'},
{type:'block',cols:['#4de1d4','#38cfc2','#7af3e8'],edge:'#168f86',hi:'#d5fffb',spark:'#fff',bg:['#2bb5c9','#0b3447'],spk:'#aef9ff'},
{type:'noise',cols:['#1a0b2e','#241040','#12081f','#2f1553'],bg:['#3a1a6b','#0d0618'],spk:'#8a4fd8'},
{type:'block',cols:['#4a3f3f','#3d3434','#574b4a'],edge:'#241d1d',hi:'#7a6c6a',bg:['#7a1f1f','#1b0707'],spk:'#ff6a3a'},
{type:'noise',cols:['#555','#3d3d3d','#6b6b6b','#2b2b2b'],bg:['#2a2a2a','#050505'],spk:'#888'},
{type:'noise',cols:['#e5e29a','#d8d58a','#efecaa'],bg:['#2a1f4a','#0a0716'],spk:'#f0eeb0'},
{type:'block',cols:['#a77ab8','#9a6cae','#b88acb'],edge:'#5e3a70',hi:'#e2baf2',bg:['#7b2d8e','#220b2b'],spk:'#f0b0ff'},
{type:'noise',cols:['#ffcf5a','#ffb92e','#ffe38a','#ff9f1a'],bg:['#ff9a2e','#4a1a00'],spk:'#fff0b0'},
{type:'block',cols:['#2e3a3e','#263034','#3a484d'],edge:'#0c1316',hi:'#5a7078',spark:'#4ff',bg:['#0f3a40','#030d10'],spk:'#4ff'},
{type:'block',cols:['#1b1e5a','#232775','#141645'],edge:'#07082a',hi:'#5a62d0',spark:'#fff',bg:['#241a6b','#02020f'],spk:'#fff'},
{type:'block',cols:['#fff6c8','#ffe98a','#fffbe6'],edge:'#c9a227',hi:'#fff',spark:'#fff',bg:['#0a1a4a','#000010'],spk:'#ffe98a'},
{type:'noise',cols:['#ff3b3b','#ffb13b','#fff03b','#3bff6a','#3bb8ff','#9a3bff'],bg:['#3a0a5a','#050010'],spk:'#fff',hue:true}
];
const MAXT=TIERS.length-1;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TEX=[];
function mkTex(i){
  const T=TIERS[i],r=rng(i*7919+3),c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');
  const pick=a=>a[(r()*a.length)|0],P=(x,y,col)=>{g.fillStyle=col;g.fillRect(x,y,1,1)};
  for(let y=0;y<16;y++)for(let x=0;x<16;x++)P(x,y,pick(T.cols));
  if(T.type==='planks'){
    for(let k=0;k<4;k++){for(let x=0;x<16;x++)P(x,k*4+3,T.edge);const jx=(k*7+3)%16;for(let y=0;y<3;y++)P(jx,k*4+y,T.edge);P((jx+8)%16,k*4+1,'#8a5f2e')}
  }else if(T.type==='ore'){
    for(let k=0;k<7;k++){const x=1+((r()*13)|0),y=1+((r()*13)|0),col=pick(T.spot);P(x,y,col);P(x+1,y,col);P(x,y+1,col);if(r()<.5)P(x+1,y+1,col)}
  }else if(T.type==='block'){
    for(let i=0;i<16;i++){P(i,0,T.hi);P(0,i,T.hi);P(i,15,T.edge);P(15,i,T.edge)}
    for(let i=1;i<15;i++){P(i,1,T.cols[0]);}
  }
  if(T.spark){for(let k=0;k<8;k++)P(1+((r()*14)|0),1+((r()*14)|0),T.spark)}
  return c;
}
TIERS.forEach((_,i)=>TEX.push(mkTex(i)));

const tierMult=t=>Math.pow(4,t);
const tierCost=l=>800*Math.pow(9,l);

/* ================= state ================= */
const DEF={coins:0,total:0,run:0,gems:0,tier:0,tap:0,cps:0,crit:0,luck:0,off:0,clicks:0,reb:0,
  boostUntil:0,music:0.5,sfx:0.7,lang:'',part:true,dLast:0,dStreak:0,lastSave:0};
let S=Object.assign({},DEF);
let sdk=null,player=null,adBusy=false,lastAd=Date.now(),frenzyUntil=0,amtMode=1;
const $=id=>document.getElementById(id);
const now=()=>Date.now();

function fmt(n){
  if(!isFinite(n))return'∞';
  if(n<1000)return n<10?(Math.round(n*10)/10).toString():Math.floor(n).toString();
  const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
  const i=Math.floor(Math.log10(n)/3);
  if(i>=SUF.length)return n.toExponential(2).replace('+','');
  return(n/Math.pow(1000,i)).toFixed(2)+SUF[i];
}
function mult(){
  let m=tierMult(S.tier)*(1+0.1*S.gems);
  if(S.boostUntil>now())m*=2;
  if(frenzyUntil>now())m*=5;
  return m;
}
const tapVal=()=>(1+S.tap)*mult();
const incPS=()=>S.cps*tapVal();
const baseInc=()=>Math.max(incPS(),tapVal()*3);

/* ================= save ================= */
function snap(){S.lastSave=now();const o={};for(const k in DEF)o[k]=S[k];return o}
function saveLocal(){try{localStorage.setItem('bclick_v1',JSON.stringify(snap()))}catch(e){}}
function saveCloud(){if(player){try{player.setData(snap())}catch(e){}}}
function loadFrom(o){if(!o||typeof o!=='object')return null;const n=Object.assign({},DEF);for(const k in DEF)if(typeof o[k]===typeof DEF[k])n[k]=o[k];return n}
function loadLocal(){try{return loadFrom(JSON.parse(localStorage.getItem('bclick_v1')))}catch(e){return null}}

/* ================= audio ================= */
let ac=null,mG=null,sG=null,mTimer=null,nextT=0,step=0;
function initAudio(){
  if(ac)return;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  ac=new C();mG=ac.createGain();sG=ac.createGain();mG.connect(ac.destination);sG.connect(ac.destination);
  applyVol();startMusic();
}
function applyVol(){if(!ac)return;mG.gain.value=S.music*0.35;sG.gain.value=S.sfx}
function pauseAudio(){if(ac&&ac.state==='running')ac.suspend()}
function resumeAudio(){if(ac&&!document.hidden&&!adBusy&&ac.state!=='running')ac.resume()}
function tone(f,t,d,type,vol,dest){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+0.05);
}
const CH=[{r:110,n:[0,3,7]},{r:87.31,n:[0,4,7]},{r:130.81,n:[0,4,7]},{r:98,n:[0,4,7]}];
function sched(){
  if(!ac||ac.state!=='running')return;
  while(nextT<ac.currentTime+0.4){
    const bar=Math.floor(step/8)%4,ch=CH[bar],k=step%8;
    if(k===0){tone(ch.r,nextT,2.2,'triangle',0.5,mG);tone(ch.r*2,nextT,2.2,'sine',0.25,mG)}
    const seq=[0,1,2,1,2,1,0,1];
    const semi=ch.n[seq[k]]+(k===4?12:0);
    tone(ch.r*4*Math.pow(2,semi/12),nextT,0.5,'sine',0.35,mG);
    nextT+=0.3;step++;
  }
}
function startMusic(){if(mTimer)return;nextT=ac.currentTime+0.1;mTimer=setInterval(sched,120)}
function sfx(kind,p){
  if(!ac||ac.state!=='running'||S.sfx<=0.01)return;
  const t=ac.currentTime;
  if(kind==='hit'){const f=180+(p||0)*18+Math.random()*60;tone(f,t,0.09,'square',0.18,sG);tone(f*0.5,t,0.12,'triangle',0.25,sG)}
  else if(kind==='crit'){tone(520,t,0.1,'square',0.2,sG);tone(780,t+0.07,0.16,'square',0.2,sG)}
  else if(kind==='buy'){[0,4,7,12].forEach((s,i)=>tone(440*Math.pow(2,s/12),t+i*0.06,0.18,'triangle',0.25,sG))}
  else if(kind==='tier'){[0,4,7,12,16,19].forEach((s,i)=>tone(330*Math.pow(2,s/12),t+i*0.08,0.3,'square',0.18,sG))}

function plan(u){

  if(n===0&&l<u.max){cost=u.cost(l);n=1}

}

/* ================= main loop ================= */
let last=performance.now(),uiT=0,saveT=0,cloudT=0;
function frame(t){
  const dt=Math.min(0.2,(t-last)/1000);last=t;
  if(!adBusy&&!document.hidden){
    if(S.cps>0){
      autoAcc+=S.cps*dt;const n=Math.floor(autoAcc);
      if(n>0){autoAcc-=n;addCoins(n*tapVal());autoVis-=dt;if(autoVis<=0){sq=Math.max(sq,.05);burst(2);floatText(fmt(tapVal()*Math.max(1,S.cps)),false);autoVis=.35;if(Math.random()<.5)sfx('hit',S.tier)}}
      autoVis-=dt*0.0;
    }
    saveT+=dt;cloudT+=dt;uiT+=dt;
    if(saveT>10){saveT=0;saveLocal()}
    if(cloudT>45){cloudT=0;saveCloud()}
  }
  if(sq>0)sq=Math.max(0,sq-dt*.55);
  drawBlock(t);
  // particles
  if(parts.length){
    cx.save();
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}
      p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;cx.globalAlpha=Math.min(1,p.l*2);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)}
    cx.restore();
  }
  // bg specks
  bx.clearRect(0,0,bgc.width,bgc.height);
  bx.fillStyle=TIERS[S.tier].spk;
  for(const s of specks){s.y-=s.v*dt;if(s.y<-10){s.y=bgc.height+10;s.x=Math.random()*bgc.width}bx.globalAlpha=s.a;bx.fillRect(s.x,s.y,s.s,s.s)}
  bx.globalAlpha=1;
  // hud
  if(uiT>0.1||true){
    $('coins').textContent=fmt(S.coins);
    const ps=incPS();
    $('ps').textContent=fmt(ps)+' '+tr('ps')+'  •  ×'+fmt(mult());
    $('gems').textContent='💎 '+S.gems;
    $('tname').textContent=tn(S.tier);
  }
  if(uiT>0.25){
    uiT=0;
    updUps();
    if($('p-bonus').classList.contains('on'))updBonus();
    if($('p-reb').classList.contains('on'))updReb();
    const ch=[];const n=now();
    if(S.boostUntil>n){const s=Math.ceil((S.boostUntil-n)/1000);ch.push('⚡ ×2 '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'))}
    if(frenzyUntil>n)ch.push('🔥 ×5 '+Math.ceil((frenzyUntil-n)/1000)+'s');
    const h=ch.map(x=>'<div class="chip">'+x+'</div>').join('');
    if($('chips').innerHTML!==h)$('chips').innerHTML=h;
  }
  requestAnimationFrame(frame);
}

  const off=Math.min(3*3600,(now()-S.lastSave)/1000);
  buildUps();buildBonus();buildReb();buildSet();applyLang();setBg(S.tier,true);schedGem(35);
  requestAnimationFrame(frame);
  try{sdk&&sdk.features&&sdk.features.LoadingAPI&&sdk.features.LoadingAPI.ready()}catch(e){}
  if(S.lastSave>0&&off>60&&S.cps>0){
    const g=incPS()*off*(0.1+0.1*S.off);
    if(g>0){modal(tr('offT'),tr('offD',fmt(g)),[
      {t:tr('take'),f:()=>{addCoins(g);sfx('gem');saveLocal()}},
      {t:tr('take2'),cls:'ad',f:()=>showRewarded(()=>{addCoins(g*2);saveLocal()})}])}
  }
}
boot();
})();
</script>
